name: Release

# Pushing a tag vX.Y.Z builds the plugin jar once and publishes it as a
# GitHub Release, with the matching CHANGELOG.md section as the body.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check the tag matches runelite-plugin.properties
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version=//p' runelite-plugin.properties)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match version=$version in runelite-plugin.properties"
            exit 1
          fi

      - run: ./gradlew build --no-daemon

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { in_section = index($0, "[" v "]") > 0; next }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no '## [$version]' section in CHANGELOG.md"
            exit 1
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: build/libs/arceuus-rc-helper-*.jar
          fail_on_unmatched_files: true
